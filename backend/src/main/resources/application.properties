# DB 접속 정보 (각자 로컬 환경에 맞게 수정)
# log4jdbc 를 통해 실행 SQL 을 로그로 확인. 실제 드라이버는 mysql-connector-j.
jdbc.driver=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
jdbc.url=jdbc:log4jdbc:mysql://localhost:3306/scoula_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
jdbc.username=scoula
jdbc.password=1234

# 오픈뱅킹 (수연) - 공통 설정 (비밀 아님). client-id/secret은 application-secret.properties
openbanking.base-url=https://testapi.openbanking.or.kr/v2.0
openbanking.callback-url=http://localhost:8080/api/openbanking/callback
openbanking.scope=login inquiry

# 웹푸시 (석윤) - VAPID subject는 푸시 서비스가 문제 시 연락하는 용도라 비밀값 아님. 키는 application-secret.properties
push.vapid.subject=mailto:push@example.com
